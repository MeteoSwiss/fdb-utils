[tool.poetry]
name = "fdb-utils"
# Define <major>.<minor>.<patch> and aligne it with the newly created tag
version = "1.5.9"
description = "Python library for users and admins of FDB."
authors = ["Victoria Cherkas <victoria.cherkas@meteoswiss.ch>"]
readme = "README.rst"
include = ["HISTORY.rst"]

[[tool.poetry.source]]
name = "pypi-mch"
url = "https://service.meteoswiss.ch/nexus/repository/python-all/simple"
priority = "primary"

[[tool.poetry.source]]
name = "pypi-mch-publish"
# only hub entrypoint can be used for publishing libraries (accessible from CI/CD server)
url = "https://hub.meteoswiss.ch/nexus/repository/python-mch/"
priority = "explicit"

[tool.poetry.scripts]
fdb-utils = "fdb_utils.main:app"

[tool.poetry.dependencies]
# eccodes, eccodeslib and pyfdb should be kept in sync with
# the uenv ref in jenkins/Jenkinsfile.archive_status_base!
python = ">=3.11"
typer = "^0.16"
eccodes = "^2.47"
matplotlib = "^3.10"
pyfdb = "^0.1.3"
packaging = "^24.1"
cffi = "^1.16.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.6.1"
pytest-mock = "*"
pydata-sphinx-theme = "^0.14.1"
pylint = "^3.0.2"
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
sphinx = ">=8.0"
sphinx-autoapi = "^3.0.0"
yapf = "^0.40.2"
python-dotenv = "^1.0.1"
eccodeslib = "~2.47.3.21"

[tool.pytest.ini_options]
testpaths = [
    "test"
]

[tool.yapf]
based_on_style = "pep8"
column_limit = "120"

[tool.pylint.master]
disable = [
    'C0114', # missing-module-docstring
    'C0115', # missing-class-docstring
    'C0116', # missing-function-docstring
    'W0511', # fix me or to-do comments are already covered by SonarQube
]

[tool.pylint.format]
# Maximum number of lines in a module.
max-line-length = 120

[tool.pylint.design]
# Minimum number of public methods for a class (see R0903).
min-public-methods = 0

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.coverage.run]
omit = ["test/**",  "doc/**"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
